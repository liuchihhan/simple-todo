<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Today</title>
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #111;
        --title-color: #111;
        --list-bg: #f5f5f5;
        --accent-color: #4a90e2;
        --border-color: #ddd;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #121212;
          --text-color: #e0e0e0;
          --title-color: #ffffff;
          --list-bg: #1e1e1e;
          --accent-color: #5dade2;
          --border-color: #444;
        }
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
        line-height: 1.6;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* 關鍵修正：移除 text-align: center */
      .container {
        width: 100%;
        max-width: 800px;
        /* 不要寫 text-align: center 在這裡！ */
      }

      /* 標題單獨置中 */
      h1 {
        font-size: 32px;
        margin-bottom: 40px;
        font-weight: 600;
        color: var(--title-color);
        text-align: center; /* 只在這裡置中 */
      }

      /* 清單完全左對齊 */
      ol {
        display: flex;
        flex-direction: column;
        font-size: 22px;
        align-items: flex-start; /* 左對齊 */
        padding-left: 0;
        margin: 0;
        text-align: left; /* 確保文字左對齊 */
      }

      li {
        margin: 20px 0;
        text-align: left; /* 左對齊 */
        border-left: 4px solid var(--accent-color);
        padding: 12px 20px 12px 30px;
        width: 100%;
        box-sizing: border-box;
      }

      [contenteditable="true"] {
        outline: none;
      }

      /* 響應式調整 */
      @media (max-width: 600px) {
        body {
          padding: 15px;
        }
        h1 {
          font-size: 28px;
          margin-bottom: 30px;
        }
        ol {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="date"></h1>

      <ol id="tasks" contenteditable="true">
        <li>Main task</li>
        <li>Secondary task</li>
        <li>Optional task</li>
      </ol>
    </div>

    <script>
      const today = new Date();
      const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      };
      document.getElementById("date").textContent = today.toLocaleDateString(
        undefined,
        options
      );

      const tasks = document.getElementById("tasks");
      const saved = localStorage.getItem("todayTasks");
      if (saved) {
        tasks.innerHTML = saved;
      }

      tasks.addEventListener("input", () => {
        localStorage.setItem("todayTasks", tasks.innerHTML);
      });
    </script>
  </body>
</html>
