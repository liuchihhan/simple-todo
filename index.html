<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Today</title>

    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #111;
        --title-color: #111;
        --list-bg: #f5f5f5;
        --accent-color: #4a90e2;
        --border-color: #ddd;
      }

      /*深色模式的設定*/
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #121212;
          --text-color: #e0e0e0;
          --title-color: #ffffff;
          --list-bg: #1e1e1e;
          --accent-color: #5dade2;
          --border-color: #444;
        }
      }

      body {
        /* Flexbox 居中佈局 */
        display: flex;
        justify-content: center; /*水平居中*/
        align-items: center; /*垂直居中*/
        min-height: 100vh;
        /*其他*/
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px; /*手機邊距*/
        line-height: 1.6;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .container {
        width: 100%;
        max-width: 800px; /*最大寬度限制防止ipad不好看*/
        text-align: center; /*文字居中*/
      }

      h1 {
        font-size: 32px;
        margin-bottom: 40px;
        font-weight: 600;
        color: var(--title-color);
      }
      ol {
        display: flex;
        flex-direction: column;
        font-size: 22px;
        align-items: center;
        padding-left: 0px;
      }
      li {
        margin: 20px 0;
        text-align: center;
        border-left: 4px solid var(--accent-color);
        padding: 5px 15px;
      }

      [contenteditable="true"] {
        outline: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1 id="date"></h1>

      <ol id="tasks" contenteditable="true">
        <li>Main task</li>
        <li>Secondary task</li>
        <li>Optional task</li>
      </ol>
    </div>

    <script>
      // show today's date
      const today = new Date();
      const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      };
      document.getElementById("date").textContent = today.toLocaleDateString(
        undefined,
        options
      );

      // load saved tasks
      const tasks = document.getElementById("tasks");
      const saved = localStorage.getItem("todayTasks");
      if (saved) {
        tasks.innerHTML = saved;
      }

      // save on change
      tasks.addEventListener("input", () => {
        localStorage.setItem("todayTasks", tasks.innerHTML);
      });
    </script>
  </body>
</html>
